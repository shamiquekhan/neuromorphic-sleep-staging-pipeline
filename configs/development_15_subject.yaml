# NeuroSleep — 15-Subject DEVELOPMENT Benchmark Configuration (ARCHIVED)
# ====================================================================
# STATUS: development experiment, NOT the primary/final benchmark.
# Historical result: 93.0% accuracy, kappa 0.861, macro-F1 0.794 (4-fold CV).
# Superseded by the 92-subject eligible-cohort benchmark
# (configs/benchmark_92_subject.yaml) — see docs/archive/development_15_subject.md.
#
# WARNING: the checkpoint this experiment produced
# (artifacts/final/student_full_finetuned.pt) was trained on 15 subjects that
# are part of the 92-subject evaluation cohort. It must NOT be used as a
# "frozen base" for 92-subject-fold evaluation (subject leakage).
# See scripts/verify_protocol.py.

model:
  name: ImprovedStudent
  parameters: 99477
  n_classes: 5

data:
  name: sleep_edf_expanded
  subjects: 15
  cache_dir: data/cache/sleep_edf

sequence:
  length: 10
  stride: 5
  epoch_seconds: 30

channels:
  - Fpz-Cz
  - Pz-Oz
  - EOG
  - EMG

classes:
  Wake: 0
  N1: 1
  N2: 2
  N3: 3
  REM: 4

training:
  seed: 42
  epochs: 15
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  loss: weighted_cross_entropy
  class_weights:
    N1: 2.0
    REM: 2.0
  device: auto

evaluation:
  method: subject_level_4fold_cv
  folds: 4
  status: archived_development_benchmark

checkpoint:
  path: artifacts/final/student_full_finetuned.pt
  base_hash: e0dfaa30eae0f767eee48803226e5c0053e80ef5826b25b9b192672ba8d1922f
  warning: >-
    Trained on 15 development subjects (SC4001-SC4072 era) that overlap the
    92-subject evaluation cohort. Do not use as frozen base for 92-subject
    fold evaluation (subject leakage). See docs/archive/development_15_subject.md.

results:
  path: results/final/fold_metrics.csv
  accuracy: 0.930
  kappa: 0.861
  macro_f1: 0.794
  weighted_f1: 0.935
  note: development result — NOT the primary generalization result
