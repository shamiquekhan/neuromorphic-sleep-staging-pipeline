dataset:
  name: "Sleep-EDF Expanded (Sleep Cassette)"
  source: "PhysioNet"
  n_subjects: 78
  channels:
    eeg1: "EEG Fpz-Cz"
    eeg2: "EEG Pz-Oz"
    eog: "EOG horizontal"
    emg: "EMG submental"
  epoch_seconds: 30
  n_classes: 5
  stage_names: ["Wake", "N1", "N2", "N3", "REM"]
  aasm_map:
    "Sleep stage W": 0
    "Sleep stage 1": 1
    "Sleep stage 2": 2
    "Sleep stage 3": 3
    "Sleep stage 4": 3
    "Sleep stage R": 4
    "Sleep stage ?": null
    "Movement time": null

splits:
  seed: 42
  train_frac: 0.70
  val_frac: 0.15
  # test_frac: 0.15 (implicit)
  strategy: "subject-level"
