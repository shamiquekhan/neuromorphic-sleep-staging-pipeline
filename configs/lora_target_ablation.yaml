# NeuroSleep — LoRA Target-Module Ablation (92-Subject Cohort)
# ==============================================================
# Experiment IDs (planned; requires LoRA-GRU support in
# src/sleep_staging/adaptation/lora.py — not yet implemented):
#   EXP-LORA-R8-HEAD        (LoRA-A: head only)
#   EXP-LORA-R8-CNNHEAD     (LoRA-B: CNN projections + head — primary)
#   EXP-LORA-R8-GABOR-CNN-HEAD (LoRA-C: Gabor projection + CNN + head)
#   EXP-LORA-R8-GRUHEAD     (LoRA-D: GRU + head — needs LoRA-GRU code)
#   EXP-LORA-R8-CNN-GRU-HEAD (LoRA-E: CNN + GRU + head — needs LoRA-GRU code)
#
# Rationale: the GRU holds 89,856 / 99,477 parameters (90.3%). The current
# primary LoRA config adapts CNN projections + head only, i.e. it asks
# whether a tiny adaptation of the convolutional representation and
# classifier can compensate for a completely frozen recurrent temporal model.
# LoRA-D/E test the complementary hypothesis (adapting the temporal model).
#
# STATUS: NOT RUN. Blocked on (a) LoRA-GRU implementation and (b) a leak-free
# base checkpoint. See docs/lora.md.

experiment:
  id: EXP-LORA-TARGET-ABLATION
  name: lora_target_ablation
  status: planned_not_run

base_checkpoint:
  path: null
  forbidden: artifacts/final/student_full_finetuned.pt  # 15-subject era — CONTAMINATED

lora:
  rank: 8
  alpha: 16
  dropout: 0.05

target_sets:
  lora_a_head: [head]
  lora_b_cnn_head: [enc.0.pw, enc.1.pw, head]
  lora_c_gabor_cnn_head: [gab_proj, enc.0.pw, enc.1.pw, head]
  lora_d_gru_head: [gru, head]              # requires LoRA-GRU support
  lora_e_cnn_gru_head: [enc.0.pw, enc.1.pw, gru, head]  # requires LoRA-GRU support

training:
  seed: 42
  epochs: 20
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 5

output:
  results_dir: results/ablations/lora_targets
