# NeuroSleep — Parameter-Efficient Adaptation Protocol (92-Subject Cohort)
# =======================================================================
# Three adaptation regimes, ALL starting from the SAME base checkpoint:
#
#   2A FROZEN      — base weights frozen, 0 trainable params, no adaptation
#   2B LORA        — base weights frozen; low-rank A/B adapters trainable on
#                     selected projection layers (enc.0.pw, enc.1.pw, head)
#   2C FULL FT     — all 99,477 parameters unfrozen and optimized
#
# Experiment IDs:
#   EXP-ADAPT-FROZEN
#   EXP-ADAPT-LORA-R8-CNNHEAD   (primary LoRA config)
#   EXP-ADAPT-FULLFT
#
# PROTOCOL REQUIREMENT (subject-disjoint base):
# The base checkpoint must be trained ONLY on subjects disjoint from every
# evaluation fold's test AND validation subjects:
#
#     base_ckpt_train_subjects ∩ eval_test_subjects  = ∅
#     base_ckpt_train_subjects ∩ eval_val_subjects    = ∅
#
# The legacy 15-subject-era checkpoint
# (artifacts/final/student_full_finetuned.pt) does NOT satisfy this
# requirement (12/15 of its training subjects appear in eval test folds).
# Results produced with it are quarantined in docs/archive/ and must not be
# reported as generalization results. Run scripts/verify_protocol.py before
# any adaptation run.

experiment:
  id: EXP-ADAPT
  name: adaptation_92_subject
  status: protocol-defined

base_checkpoint:
  # REQUIRED: a checkpoint trained on the 10 eval-validation subjects ONLY
  # (or any subject set disjoint from all test folds). Produce it with:
  #   python scripts/train_adaptation.py --mode full_finetune --fold 0 ...
  # or the dedicated base-training run described in docs/adaptation.md.
  path: null  # fill after base retraining; verify with scripts/verify_protocol.py
  requirement: base_train_subjects disjoint from eval test AND validation subjects
  forbidden: artifacts/final/student_full_finetuned.pt  # 15-subject era — CONTAMINATED

data:
  name: sleep_edf_expanded
  records_downloaded: 100
  subjects_excluded_wake_only: 8
  subjects_eligible: 92
  folds_manifest: data/manifests/canonical_subject_folds_92subj.json

sequence:
  length: 10
  stride: 5
  epoch_seconds: 30

channels: [Fpz-Cz, Pz-Oz, EOG, EMG]
sampling_rate: 100

training:
  seeds: [42, 43, 44]
  epochs: 20
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  early_stopping_patience: 5
  checkpoint_selection: val_macro_f1
  mixed_precision: true

modes:
  frozen:
    experiment_id: EXP-ADAPT-FROZEN
    trainable_params: 0
    description: Base weights frozen; no parameter updates; evaluation only.
  lora:
    experiment_id: EXP-ADAPT-LORA-R8-CNNHEAD
    rank: 8
    alpha: 16
    dropout: 0.05
    targets: [enc.0.pw, enc.1.pw, head]
    trainable_params: 1448
    description: >-
      Base weights frozen; low-rank adapters (r=8, alpha=16) inserted into the
      two CNN pointwise projections and the classification head. The GRU
      (89,856 params, 90.3% of the model) is NOT adapted in this configuration.
  full_finetune:
    experiment_id: EXP-ADAPT-FULLFT
    trainable_params: 99477
    description: All parameters unfrozen and optimized from the base checkpoint.

output:
  results_dir: results/adaptation
  legacy_contaminated_dir: results/100_subject_adaptation  # 15-subject-era base — quarantined
