base_checkpoint: artifacts/student_improved_best.pt

lora:
  rank: 4
  alpha: 8.0
  dropout: 0.05
  target_modules:
    - head

training:
  seed: 42
  epochs: 10
  learning_rate: 3.0e-4
  batch_size: 16
  weight_decay: 1.0e-4
  grad_clip: 1.0

data:
  stride: 5
  train_subjects: []   # auto-select from available
  val_subjects: []     # auto-select from available

output_dir: artifacts/lora/head_r4
