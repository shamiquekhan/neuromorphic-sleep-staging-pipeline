preprocessing:
  bandpass:
    low_hz: 0.5
    high_hz: 35.0
    order: 4
  notch:
    freq_hz: 50.0
    quality_factor: 30.0
  normalization: "z-score"
  artifact_qc:
    clipping_threshold: 8.0
    flatline_std_threshold: 0.05
  sampling_rate_hz: 100
  epoch_seconds: 30

cache:
  dir: "data/cache"
  format: "npz"
