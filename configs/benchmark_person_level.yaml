# NeuroSleep — Person-Level 92-Record Benchmark (PRIMARY as of Sept 2026)
# =====================================================================
# STATUS: PRIMARY benchmark configuration. Supersedes benchmark_92_subject.yaml
# (whose record-level folds leak at person level — see below).
#
# KEY FACT: SC4ss1 and SC4ss2 are TWO NIGHTS OF THE SAME PERSON
# (PhysioNet sleep-edfx README: "ss is the subject number, and N is the
# night"; confirmed by SC-subjects.xls and EDF headers). The 92-record
# eligible cohort is therefore 52 PERSONS (40 two-night, 12 one-night).
#
# The legacy canonical_subject_folds_92subj.json treats the two nights as
# independent "subjects": in 10/10 folds, a test record's same-person
# mate is in the train set. Numbers from those folds (87.66% ± 2.22%)
# are RECORD-level estimates, not person-generalization.
#
# This config uses person_folds_52subj.json: whole persons (both nights)
# are assigned to train/test; 5 fixed validation persons; folds
# stratified by age decade (cohort spans 25–101 yr).
#
# Cohort phrasing (use everywhere): "92-record eligible cohort (52
# persons) from 100 downloaded Sleep-EDF Expanded records (8 wake-only
# excluded)."
#
# Experiment ID: EXP-BENCH-PERSON
#
# Evidence status:
#   - not yet run (see ROADMAP.md)

experiment:
  id: EXP-BENCH-PERSON
  name: benchmark_person_level
  status: primary
  supersedes: EXP-BENCH-92SUBJ (record-level folds, person leakage)

model:
  name: ImprovedStudent
  parameters: 99477
  n_classes: 5
  architecture:
    gru_hidden: 64
    gru_layers: 2
    stem_width: 10
    encoder_channels: [32, 32]
    gabor_n_filters: 8
    gabor_out_dim: 32

data:
  name: sleep_edf_expanded
  records_downloaded: 100
  records_excluded_wake_only: 8
  records_eligible: 92
  persons_eligible: 52
  cache_dir: data/cache/sleep_edf
  manifest: data/manifests/sleep_edf_expanded.json
  folds_manifest: data/manifests/person_folds_52subj.json
  person_groups: data/manifests/person_groups.json

sequence:
  length: 10
  # Training windows: subject-safe (never cross a subject boundary or an
  # unlabeled-epoch gap), stride 5, all-position supervision (training
  # signal only — never used for reporting).
  train_stride: 5
  # Evaluation: causal protocol — stride 1, last-epoch supervision,
  # exactly one prediction per scored epoch with (subject, epoch)
  # provenance. See docs/evaluation_protocol.md.
  eval_stride: 1
  eval_supervision: last_epoch
  eval_protocol: causal_unique_epoch
  epoch_seconds: 30
  samples_per_epoch: 3000

channels:
  - Fpz-Cz
  - Pz-Oz
  - EOG
  - EMG

sampling_rate: 100
n_channels: 4

classes:
  Wake: 0
  N1: 1
  N2: 2
  N3: 3
  REM: 4

training:
  initialization: from_scratch
  seed: 42
  seeds_planned: [42, 43, 44]
  seeding: seed_everything (python/numpy/torch/cuda/cudnn; deterministic cudnn)
  epochs: 20
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  loss: weighted_cross_entropy
  class_weights:
    N1: 2.0
    REM: 2.0
  scheduler: cosine
  warmup_fraction: 0.1
  early_stopping_patience: 5
  checkpoint_selection: val_macro_f1
  device: auto
  mixed_precision: true
  pin_memory: true
  num_workers: 4
  # training windows use all positions; reporting is causal last-epoch
  supervision: all_position_train_only

evaluation:
  method: 10-fold person-level CV
  folds: 10
  person_level: true
  unit_of_analysis: unique_scored_epoch
  protocol: causal_unique_epoch
  seeds: [42, 43, 44]

metrics:
  - accuracy
  - kappa
  - macro_f1
  - weighted_f1
  - mgm
  - per_class_f1
  - per_class_recall
  - per_class_precision
  - confusion_matrix

output:
  results_dir: results/benchmark_person_level
  per_fold_dir: results/benchmark_person_level/fold_{fold:02d}
