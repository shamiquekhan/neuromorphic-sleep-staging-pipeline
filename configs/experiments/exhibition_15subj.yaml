# NeuroSleep — Exhibition 15-Subject Holdout (Historical)
# ========================================================
# This experiment reproduces the historical exhibition result (~88.64% accuracy)
# under the LEGACY protocol (all-position evaluation, record-level split).
#
# KEY DISTINCTION:
# - Split: 70/15/15 at SUBJECT level (100 records, but only 52 unique persons)
# - Training: all-position supervision (stride=5)
# - Evaluation: legacy_all_position (all positions scored, stride=5)
# - This is the HISTORICAL exhibition result, NOT the primary research benchmark.
# - The primary benchmark is EXP-BENCH-PERSON (person-level, causal protocol).

experiment:
  id: EXP-EXHIBITION-15SUBJ
  name: "Exhibition 15-Subject Holdout"
  status: historical
  description: "Fixed 70/15/15 subject-level split for exhibition demonstration (legacy protocol)"

dataset:
  name: Sleep-EDF Expanded
  records_downloaded: 100
  records_eligible: 100
  persons_eligible: 52  # SC4ss1/SC4ss2 are same person (two nights)
  split_level: subject
  manifest: data/manifests/exhibition_15subj_v1.json

sequence:
  length: 10
  train_stride: 5
  eval_stride: 5
  eval_supervision: all_position
  eval_protocol: legacy_all_position
  epoch_seconds: 30
  samples_per_epoch: 3000

channels:
  - Fpz-Cz
  - Pz-Oz
  - EOG
  - EMG

sampling_rate: 100
n_channels: 4
n_classes: 5

classes:
  Wake: 0
  N1: 1
  N2: 2
  N3: 3
  REM: 4

training:
  initialization: from_scratch
  seed: 42
  epochs: 20
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  loss:
    teacher: focal_loss
    student: distillation_ce_kl
  scheduler: cosine_warmup
  warmup_fraction: 0.1
  checkpoint_selection: val_kappa
  device: auto
  mixed_precision: true
  pin_memory: true
  num_workers: 0
  supervision: all_position

teacher:
  name: ImprovedTeacher
  architecture:
    stem_short: {kernel: 25, stride: 6, channels: 16}
    stem_long: {kernel: 200, stride: 25, channels: 16}
    encoder: [ResBlock1D(32), ResBlock1D(32), AdaptiveAvgPool1d(32)]
    spectral_filterbank: {n_filters: 32, n_freqs: 129}
    fusion: {gate_input_dim: 96, gate_output_dim: 96}
    transformer: {layers: 2, d_model: 96, nhead: 4, dim_feedforward: 192, dropout: 0.1}
    head: {in_features: 96, out_features: 5}

student:
  name: ImprovedStudent
  architecture:
    stem_width: 8
    encoder_channels: [32, 32]
    gabor_n_filters: 8
    gabor_out_dim: 16
    gru_hidden: 64
    gru_layers: 2
    feature_dim: 272  # 32*8 + 16
  parameters: 99477

distillation:
  temperature_start: 8.0
  temperature_end: 4.0
  temperature_schedule: linear
  kl_weight: 0.5
  ce_weight: 1.0

evaluation:
  protocol: legacy_all_position
  stride: 5
  target_positions: all
  unit_of_analysis: sequence_position

output:
  results_dir: results/exhibition/EXP-EXHIBITION-15SUBJ
  artifacts_dir: artifacts/exhibition/EXP-EXHIBITION-15SUBJ
  checkpoint_dir: artifacts/exhibition/EXP-EXHIBITION-15SUBJ/seed-42